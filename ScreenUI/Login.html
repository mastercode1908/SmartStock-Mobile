<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-8">
    <!-- Header -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-primary text-on-primary rounded-xl mb-4 shadow-sm">
            <span class="material-symbols-outlined text-4xl" data-icon="inventory_2" data-weight="fill" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
        </div>
        <h1 class="font-headline-md text-headline-md text-on-surface mb-2">Smart Stock</h1>
        <p class="font-body-md text-body-md text-on-surface-variant">Hệ thống quản lý kho vận chuyên nghiệp</p>
    </div>
    <!-- Login Form -->
    <form class="space-y-4">
        <!-- Email / Mã NV -->
        <div>
            <label class="block font-label-md text-label-md text-on-surface mb-1" for="username">Mã nhân viên / Email</label>
            <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
                <input class="w-full h-10 pl-10 pr-4 bg-surface rounded border border-outline-variant text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="username" name="username" placeholder="Nhập mã nhân viên hoặc email" type="text">
            </div>
        </div>
        <!-- Mật khẩu -->
        <div>
            <div class="flex justify-between items-center mb-1">
                <label class="block font-label-md text-label-md text-on-surface" for="password">Mật khẩu</label>
                <a class="font-body-md text-body-md text-primary hover:underline" href="#">Quên mật khẩu?</a>
            </div>
            <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
                <input class="w-full h-10 pl-10 pr-10 bg-surface rounded border border-outline-variant text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="password" name="password" placeholder="Nhập mật khẩu" type="password">
                <button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" onclick="togglePassword()" type="button">
                    <span class="material-symbols-outlined" data-icon="visibility" id="visibility-icon">visibility</span>
                </button>
            </div>
        </div>
        <!-- Nút Đăng nhập -->
        <div class="pt-4">
            <button class="w-full h-10 bg-primary text-on-primary font-body-md text-body-md font-semibold rounded hover:opacity-90 transition-opacity flex items-center justify-center gap-2 shadow-sm" type="submit">
                Đăng nhập
                <span class="material-symbols-outlined text-sm" data-icon="login">login</span>
            </button>
        </div>
    </form>
    <!-- Divider -->
    <div class="mt-8 mb-6 flex items-center">
        <div class="flex-grow border-t border-outline-variant"></div>
        <span class="px-4 font-body-md text-body-md text-outline">hoặc</span>
        <div class="flex-grow border-t border-outline-variant"></div>
    </div>
    <!-- Google Login -->
    <div>
        <button class="w-full h-10 bg-surface-container-lowest text-on-surface border border-outline-variant font-body-md text-body-md font-medium rounded hover:bg-surface-container-low transition-colors flex items-center justify-center gap-2" type="button">
            <img alt="Google logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBEIJFwBGQF4WGwA90QCAeAQ43qNmHgt5Qn5TWSM8SJEOmzkTLFEONBWII_GNtUbouQaPoniqZ2jqreFywc_-6OAYj2RKHKBmTxk0Zj0fmt-xxeEMIh42l3uxdjYrTrhrn1wITIfpe5XcisZxZX5XGkQ9GE5u3GIRThYD-4VhXnKOBUGe-rWrjxxmBbF88QNjoEvA5QJZ4Fv_UiM64NuSf2Ke9uRZ11HxrZABqoPH-TX_0rS8fygp4Ohe9Sp4N-NoVK5oD2bSSuk8_M">
            Đăng nhập bằng Google
        </button>
    </div>
</div>
<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const visibilityIcon = document.getElementById('visibility-icon');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            visibilityIcon.textContent = 'visibility_off';
            visibilityIcon.setAttribute('data-icon', 'visibility_off');
        } else {
            passwordInput.type = 'password';
            visibilityIcon.textContent = 'visibility';
            visibilityIcon.setAttribute('data-icon', 'visibility');
        }
    }
</script>
