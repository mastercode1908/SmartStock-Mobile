<!DOCTYPE html><html lang="vi"><head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Chọn Sản phẩm</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary-fixed-variant": "#00504e",
                      "on-surface-variant": "#59413f",
                      "on-tertiary-container": "#003533",
                      "on-primary-container": "#64000d",
                      "secondary-fixed": "#dde4e6",
                      "surface-tint": "#b3272e",
                      "surface-container-lowest": "#ffffff",
                      "secondary": "#586062",
                      "surface": "#f1fbff",
                      "on-secondary": "#ffffff",
                      "inverse-surface": "#283236",
                      "tertiary-fixed": "#5af9f3",
                      "on-surface": "#131d21",
                      "surface-bright": "#f1fbff",
                      "surface-container-highest": "#d9e4e9",
                      "on-secondary-fixed-variant": "#41484a",
                      "on-background": "#131d21",
                      "primary-container": "#ff5f5f",
                      "inverse-on-surface": "#e7f3f7",
                      "tertiary-container": "#00a7a3",
                      "surface-container": "#e4f0f4",
                      "secondary-fixed-dim": "#c1c8ca",
                      "primary-fixed-dim": "#ffb3af",
                      "error": "#ba1a1a",
                      "primary": "#b3272e",
                      "on-secondary-fixed": "#161d1f",
                      "surface-variant": "#d9e4e9",
                      "on-tertiary": "#ffffff",
                      "primary-fixed": "#ffdad7",
                      "on-primary-fixed-variant": "#91081a",
                      "error-container": "#ffdad6",
                      "on-error": "#ffffff",
                      "surface-container-high": "#dfeaef",
                      "on-secondary-container": "#5d6466",
                      "on-tertiary-fixed": "#00201f",
                      "inverse-primary": "#ffb3af",
                      "outline-variant": "#e1bebc",
                      "background": "#f1fbff",
                      "on-primary-fixed": "#410005",
                      "surface-container-low": "#eaf5fa",
                      "secondary-container": "#dae1e3",
                      "tertiary": "#006a67",
                      "on-primary": "#ffffff",
                      "tertiary-fixed-dim": "#2edcd7",
                      "outline": "#8d706e",
                      "on-error-container": "#93000a",
                      "surface-dim": "#d1dce0"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xs": "4px",
                      "md": "16px",
                      "xl": "48px",
                      "lg": "24px",
                      "sm": "8px",
                      "gutter": "24px",
                      "unit": "4px",
                      "margin-mobile": "16px",
                      "margin-desktop": "64px"
              },
              "fontFamily": {
                      "body-lg": [
                              "Hanken Grotesk"
                      ],
                      "label-md": [
                              "JetBrains Mono"
                      ],
                      "body-sm": [
                              "Hanken Grotesk"
                      ],
                      "title-md": [
                              "Hanken Grotesk"
                      ],
                      "headline-lg-mobile": [
                              "Hanken Grotesk"
                      ],
                      "headline-lg": [
                              "Hanken Grotesk"
                      ],
                      "display-lg": [
                              "Hanken Grotesk"
                      ]
              },
              "fontSize": {
                      "body-lg": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ],
                      "label-md": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "500"
                              }
                      ],
                      "body-sm": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "400"
                              }
                      ],
                      "title-md": [
                              "20px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "600"
                              }
                      ],
                      "headline-lg-mobile": [
                              "28px",
                              {
                                      "lineHeight": "36px",
                                      "fontWeight": "600"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "600"
                              }
                      ],
                      "display-lg": [
                              "48px",
                              {
                                      "lineHeight": "56px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ]
              }
      },
          },
        }
    </script>
    <style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="text-on-background font-body-lg antialiased bg-white">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-margin-mobile h-16 dark:bg-surface-dim/80 backdrop-blur-md shadow-sm bg-white">
    <button class="text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 duration-200 mr-sm">
        <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
    </button>
    <h1 class="flex-1 font-headline-lg-mobile font-bold truncate text-title-md" style="color: #b3272e;">Chọn Sản phẩm</h1>
    <button class="p-2 flex items-center justify-center text-primary"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">inventory_2</span></button>
</header>
<!-- Main Content -->
<main class="pt-[80px] pb-[100px] px-margin-mobile max-w-3xl mx-auto">
    <!-- Search & Filter -->
    <div class="flex items-center gap-md mb-lg">
        <div class="flex-1 relative">
            <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant/50">search</span>
            <input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg py-sm pl-[40px] pr-sm font-body-sm text-body-sm focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors shadow-[0px_4px_20px_rgba(0,0,0,0.04)] placeholder:text-on-surface-variant/50" placeholder="Tìm tên, SKU..." type="text">
        </div>
        <button class="bg-surface-container-lowest border border-outline-variant/50 rounded-lg p-sm shadow-[0px_4px_20px_rgba(0,0,0,0.04)] text-on-surface-variant hover:bg-surface-container-low transition-colors" onclick="document.getElementById('filterModal').classList.remove('hidden')">
            <span class="material-symbols-outlined" data-icon="tune">tune</span>
        </button>
    </div><div class="flex gap-sm overflow-x-auto pb-sm no-scrollbar -mx-margin-mobile px-margin-mobile mb-md">
    <button class="whitespace-nowrap px-md py-xs rounded-full text-on-primary font-label-md text-label-md shadow-sm bg-[#ff5f5f]" style="background-color: rgb(179, 39, 46);">Tất cả</button>
    <button class="whitespace-nowrap px-md py-xs rounded-full bg-surface-container-highest text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-colors">Kệ A1</button>
    <button class="whitespace-nowrap px-md py-xs rounded-full bg-surface-container-highest text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-colors">Kệ B2</button>
    <button class="whitespace-nowrap px-md py-xs rounded-full bg-surface-container-highest text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-colors">S/N Tracking</button>
</div>
    <!-- Product List -->
    <div class="flex flex-col gap-sm">
        <!-- Product Card 1 -->
        <label class="flex items-center bg-surface-container-lowest rounded-lg p-3 shadow-sm cursor-pointer group hover:bg-surface-container-low transition-colors">
            <div class="flex-1 flex flex-col gap-[2px]"><h3 class="font-body-lg text-body-lg font-semibold text-on-surface leading-tight">Laptop Dell XPS 15</h3>
                <div class="flex items-center gap-2 text-on-surface-variant mt-1">
                    <span class="text-[11px] font-medium tracking-wider">SKU: DEL-XPS-15</span>
                    <span class="text-[11px] font-medium px-2 py-[2px] bg-secondary-container/50 rounded-full">Kệ A1</span>
                </div>
                <div class="flex items-center justify-between mt-1">
                    <span class="text-[11px] font-medium text-secondary uppercase">S/N Tracking</span>
                    <div class="flex items-center gap-1 bg-surface-container-low px-2 py-0.5 rounded border border-outline-variant/30">
                        <span class="text-[11px] text-on-surface-variant/70">Thực tế:</span>
                        <input class="w-8 bg-transparent border-none p-0 text-right font-body-lg text-on-primary-fixed-variant focus:ring-0 h-5" type="number" value="1">
                    </div>
                </div></div>
            <div class="ml-3">
                <input checked="" class="w-5 h-5 rounded-full border-outline-variant text-primary-container focus:ring-primary-container cursor-pointer" style="color: #ff5f5f; --tw-ring-color: #ff5f5f;" type="checkbox">
            </div>
        </label>
        <!-- Product Card 2 -->
        <label class="flex items-center bg-surface-container-lowest rounded-lg p-3 shadow-sm cursor-pointer group hover:bg-surface-container-low transition-colors">
            <div class="flex-1 flex flex-col gap-[2px]"><h3 class="font-body-lg text-body-lg font-semibold text-on-surface leading-tight">Màn hình LG 27UL850</h3>
                <div class="flex items-center gap-2 text-on-surface-variant mt-1">
                    <span class="text-[11px] font-medium tracking-wider">SKU: LG-27UL</span>
                    <span class="text-[11px] font-medium px-2 py-[2px] bg-secondary-container/50 rounded-full">Kệ B2</span>
                </div>
                <div class="flex items-center justify-between mt-1">
                    <span class="text-[11px] font-medium text-secondary uppercase">Lot Tracking</span>
                    <div class="flex items-center gap-1 bg-surface-container-low px-2 py-0.5 rounded border border-outline-variant/30">
                        <span class="text-[11px] text-on-surface-variant/70">Thực tế:</span>
                        <input class="w-8 bg-transparent border-none p-0 text-right font-body-lg text-on-primary-fixed-variant focus:ring-0 h-5" type="number" value="1">
                    </div>
                </div></div>
            <div class="ml-3">
                <input checked="" class="w-5 h-5 rounded-full border-outline-variant text-primary-container focus:ring-primary-container cursor-pointer" style="color: #ff5f5f; --tw-ring-color: #ff5f5f;" type="checkbox">
            </div>
        </label>
        <!-- Product Card 3 -->
        <label class="flex items-center bg-surface-container-lowest rounded-lg p-3 shadow-sm cursor-pointer group hover:bg-surface-container-low transition-colors">
            <div class="flex-1 flex flex-col gap-[2px]"><h3 class="font-body-lg text-body-lg font-semibold text-on-surface leading-tight">Bàn phím cơ Keychron K2</h3>
                <div class="flex items-center gap-2 text-on-surface-variant mt-1">
                    <span class="text-[11px] font-medium tracking-wider">SKU: KCH-K2V2</span>
                    <span class="text-[11px] font-medium px-2 py-[2px] bg-secondary-container/50 rounded-full">Kệ C3</span>
                </div>
                <div class="flex items-center justify-between mt-1">
                    <span class="text-[11px] font-medium text-secondary uppercase">No Tracking</span>
                    <div class="flex items-center gap-1 bg-surface-container-low px-2 py-0.5 rounded border border-outline-variant/30">
                        <span class="text-[11px] text-on-surface-variant/70">Thực tế:</span>
                        <input class="w-8 bg-transparent border-none p-0 text-right font-body-lg text-on-primary-fixed-variant focus:ring-0 h-5" type="number" value="0">
                    </div>
                </div></div>
            <div class="ml-3">
                <input class="w-5 h-5 rounded-full border-outline-variant text-primary-container focus:ring-primary-container cursor-pointer" type="checkbox" placeholder="on" value="">
            </div>
        </label>
        <!-- Product Card 4 -->
        <label class="flex items-center bg-surface-container-lowest rounded-lg p-3 shadow-sm cursor-pointer group hover:bg-surface-container-low transition-colors">
            <div class="flex-1 flex flex-col gap-[2px]"><h3 class="font-body-lg text-body-lg font-semibold text-on-surface leading-tight">Chuột Logitech MX Master 3</h3>
                <div class="flex items-center gap-2 text-on-surface-variant mt-1">
                    <span class="text-[11px] font-medium tracking-wider">SKU: LOG-MX3</span>
                    <span class="text-[11px] font-medium px-2 py-[2px] bg-secondary-container/50 rounded-full">Kệ A2</span>
                </div>
                <div class="flex items-center justify-between mt-1">
                    <span class="text-[11px] font-medium text-secondary uppercase">S/N Tracking</span>
                    <div class="flex items-center gap-1 bg-surface-container-low px-2 py-0.5 rounded border border-outline-variant/30">
                        <span class="text-[11px] text-on-surface-variant/70">Thực tế:</span>
                        <input class="w-8 bg-transparent border-none p-0 text-right font-body-lg text-on-primary-fixed-variant focus:ring-0 h-5" type="number" value="0">
                    </div>
                </div></div>
            <div class="ml-3">
                <input class="w-5 h-5 rounded-full border-outline-variant text-primary-container focus:ring-primary-container cursor-pointer" type="checkbox">
            </div>
        </label>
    </div>
</main>
<!-- BottomNavBar (Custom Action) -->
<div class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter py-md bg-surface dark:bg-surface-container shadow-[0px_-4px_20px_rgba(0,0,0,0.04)] rounded-t-xl">
    <button class="flex-1 flex items-center justify-center gap-sm bg-surface-container-low text-on-surface-variant font-title-md text-title-md rounded-lg py-sm mr-sm hover:bg-surface-container transition-colors active:scale-95">
        <span class="material-symbols-outlined" data-icon="close">close</span>
        Hủy
    </button>
    <button class="flex-[2] flex items-center justify-center gap-sm text-on-primary font-title-md text-title-md rounded-lg py-sm shadow-lg hover:opacity-90 transition-opacity active:scale-95 bg-[#ff5f5f]" style="background-color: rgb(179, 39, 46);"><span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Xác nhận chọn (2)</button>
</div>
<!-- Filter Modal -->
<div class="fixed inset-0 z-[60] flex items-end justify-center hidden" id="filterModal">
    <div class="absolute inset-0 bg-on-background/40 backdrop-blur-sm" onclick="document.getElementById('filterModal').classList.add('hidden')"></div>
    <div class="relative bg-surface-container-lowest w-full max-w-3xl rounded-t-2xl flex flex-col max-h-[90vh]">
        <div class="flex items-center justify-between p-md border-b border-outline-variant/30">
            <h2 class="font-title-md text-title-md text-on-surface">Bộ lọc nâng cao</h2>
            <button class="text-on-surface-variant hover:text-on-surface transition-colors p-1" onclick="document.getElementById('filterModal').classList.add('hidden')">
                <span class="material-symbols-outlined" data-icon="close">close</span>
            </button>
        </div>
        <div class="p-md flex-1 overflow-y-auto flex flex-col gap-lg">
            <!-- Vị trí -->
            <div class="flex flex-col gap-sm">
                <h3 class="font-body-lg text-body-lg font-semibold text-on-surface">Vị trí</h3>
                <div class="flex flex-wrap gap-2">
                    <button class="px-4 py-1.5 rounded-full border border-primary text-primary bg-primary/5 font-label-md text-label-md">Kệ A1</button>
                    <button class="px-4 py-1.5 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md">Kệ B2</button>
                    <button class="px-4 py-1.5 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md">Kệ C3</button>
                </div>
            </div>
            <!-- Phương thức theo dõi -->
            <div class="flex flex-col gap-sm">
                <h3 class="font-body-lg text-body-lg font-semibold text-on-surface">Phương thức theo dõi</h3>
                <div class="flex flex-wrap gap-2">
                    <button class="px-4 py-1.5 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md">S/N Tracking</button>
                    <button class="px-4 py-1.5 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md">Batch Tracking</button>
                    <button class="px-4 py-1.5 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md">No tracking</button>
                </div>
            </div>
            <!-- Trạng thái -->
            <div class="flex flex-col gap-sm">
                <h3 class="font-body-lg text-body-lg font-semibold text-on-surface">Trạng thái số lượng</h3>
                <div class="flex flex-wrap gap-2">
                    <button class="px-4 py-1.5 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md">Còn hàng</button>
                    <button class="px-4 py-1.5 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md">Hết hàng</button>
                </div>
            </div>
        </div>
        <div class="p-md border-t border-outline-variant/30 flex gap-md bg-surface rounded-t-xl pb-[calc(1rem+env(safe-area-inset-bottom))]">
            <button class="flex-1 py-sm rounded-lg border border-outline-variant text-on-surface-variant font-title-md text-title-md hover:bg-surface-container transition-colors" onclick="document.getElementById('filterModal').classList.add('hidden')">Thiết lập lại</button>
            <button class="flex-1 py-sm rounded-lg text-on-primary font-title-md text-title-md shadow-sm hover:opacity-90 transition-opacity bg-[#ff5f5f]" onclick="document.getElementById('filterModal').classList.add('hidden')" style="background-color: rgb(179, 39, 46);">Áp dụng</button>
        </div>
    </div>
</div>


</body></html>
