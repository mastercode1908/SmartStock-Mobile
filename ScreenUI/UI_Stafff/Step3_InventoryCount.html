<body class="bg-background text-on-background min-h-screen flex flex-col">
    <!-- TopAppBar -->
    <header
        class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim bg-surface-container-low dark:bg-surface-container-lowest">
        <div class="flex items-center justify-between px-margin-mobile h-16 w-full">
            <div class="flex items-center gap-md">
                <button
                    class="active:scale-95 transition-transform text-primary dark:text-primary-fixed-dim hover:bg-surface-variant transition-colors p-sm rounded-full flex items-center justify-center">
                    <span class="material-symbols-outlined" data-icon="close">close</span>
                </button>
                <h1 class="font-title-lg text-title-lg text-primary dark:text-primary-fixed-dim font-bold">Warehouse Pro
                </h1>
            </div>
            <button
                class="active:scale-95 transition-transform text-primary dark:text-primary-fixed-dim hover:bg-surface-variant transition-colors p-sm rounded-full flex items-center justify-center">
                <span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
            </button>
        </div>
    </header>
    <!-- Main Content Canvas -->
    <main
        class="flex-grow pt-24 pb-32 px-margin-mobile md:px-margin-desktop max-w-2xl mx-auto w-full flex flex-col items-center justify-center">
        <!-- Wizard Header -->
        <div class="text-center w-full mb-lg">
            <h2 class="font-headline-md text-headline-md text-primary mb-sm">Bước 3/5: Nhập số lượng</h2>
            <p class="font-body-md text-body-md text-on-surface-variant">Kiểm đếm và nhập số lượng thực tế tại vị trí
            </p>
            <!-- Progress Bar -->
            <div class="w-full bg-surface-container-high h-2 rounded-full mt-md overflow-hidden">
                <div class="bg-primary h-full w-3/5 rounded-full transition-all duration-300"></div>
            </div>
        </div>
        <!-- Product Info Card -->
        <div
            class="w-full bg-surface-container-lowest border border-outline-variant rounded-[1rem] p-lg mb-xl shadow-[0_4px_16px_rgba(239,83,80,0.08)]">
            <div class="flex items-start gap-md mb-md">
                <div class="w-16 h-16 rounded-[1rem] bg-surface-container overflow-hidden shrink-0">
                    <img alt="Product Image" class="w-full h-full object-cover"
                        data-alt="A clean, minimalist product photo of industrial safety gloves on a sterile white background. Soft, diffused studio lighting highlights the texture of the material. The image reflects a high-end corporate modern aesthetic with precise focus."
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuAwEoDaXP6eOLaXhYLmu1LctAW5sBPE0mjZ0lMqgmadL3iB_Me7zlR4cO-_aPu7eOBk5IE1_13Sw_bM9Ti97UTHEMqnz-dRKOwQ8mTE6UNvCfxW1WG-kzvrOH7w3W_DzI5oo1QgMrcd6LWEktEB0GroDZZ0sdTYOsV6Eq08hy7r4LD6D0gUaeSojZ9FgVesA9JetI9_7AV72u7xYQSOBU2QXOmmlC0pC0rahj3q7d4s2WEe8pn5Mn3qpJnwsopa4AGdVVi8NmiUyy1w" />
                </div>
                <div class="flex-grow">
                    <h3 class="font-title-lg text-title-lg text-on-surface mb-xs">Găng tay bảo hộ cao cấp</h3>
                    <p class="font-body-md text-body-md text-on-surface-variant">Mã SP: SK-GL-992</p>
                    <p class="font-body-md text-body-md text-on-surface-variant">Vị trí: Rack A2, Kệ 04</p>
                </div>
            </div>
            <div class="flex justify-between items-center p-md bg-surface-container rounded-[1rem]">
                <span class="font-body-lg text-body-lg text-on-surface-variant">Số lượng hệ thống:</span>
                <span class="font-headline-md text-headline-md text-on-surface">50 <span
                        class="font-body-md text-body-md text-on-surface-variant">Cái</span></span>
            </div>
        </div>
        <!-- Quantity Input Section -->
        <div class="w-full flex flex-col items-center mb-xl">
            <label class="font-title-lg text-title-lg text-on-surface mb-md" for="actual-qty">Số lượng thực tế</label>
            <div class="flex items-center justify-center gap-md w-full">
                <button
                    class="w-16 h-16 rounded-[1rem] bg-surface-container-highest text-on-surface flex items-center justify-center active:scale-95 transition-transform hover:bg-surface-variant shadow-[0_4px_16px_rgba(239,83,80,0.08)]"
                    onclick="decrementQty()" type="button">
                    <span class="material-symbols-outlined" data-icon="remove">remove</span>
                </button>
                <input
                    class="w-32 h-20 text-center font-display text-display text-on-surface bg-transparent border-b-2 border-outline focus:border-primary focus:outline-none focus:ring-0 transition-colors bg-[#FEEBEE]/10 rounded-t-[1rem]"
                    id="actual-qty" type="number" value="50" />
                <button
                    class="w-16 h-16 rounded-[1rem] bg-surface-container-highest text-on-surface flex items-center justify-center active:scale-95 transition-transform hover:bg-surface-variant shadow-[0_4px_16px_rgba(239,83,80,0.08)]"
                    onclick="incrementQty()" type="button">
                    <span class="material-symbols-outlined" data-icon="add">add</span>
                </button>
            </div>
        </div>
    </main>
    <!-- Bottom Action Bar -->
    <div
        class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant p-margin-mobile flex justify-center z-50 flex-col items-center">
        <div class="grid grid-cols-2 gap-md w-full max-w-2xl mb-md">
            <button
                class="flex items-center justify-center gap-sm p-md rounded-[1rem] border border-outline-variant text-on-surface-variant font-label-lg transition-colors hover:bg-surface-variant active:scale-95">
                <span class="material-symbols-outlined text-[20px]">report</span>
                Báo thiếu
            </button>
            <button
                class="flex items-center justify-center gap-sm p-md rounded-[1rem] border border-outline-variant text-on-surface-variant font-label-lg transition-colors hover:bg-surface-variant active:scale-95">
                <span class="material-symbols-outlined text-[20px]">qr_code_scanner</span>
                Quét lại
            </button>
        </div><button
            class="w-full max-w-2xl bg-primary text-on-primary font-title-lg text-title-lg py-md rounded-[1rem] active:scale-95 transition-transform shadow-[0_4px_16px_rgba(239,83,80,0.16)] flex justify-center items-center gap-sm">
            Tiếp theo
            <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
        </button>
    </div>
    <script>
        const qtyInput = document.getElementById('actual-qty');

        function incrementQty() {
            let val = parseInt(qtyInput.value) || 0;
            qtyInput.value = val + 1;
        }

        function decrementQty() {
            let val = parseInt(qtyInput.value) || 0;
            if (val > 0) {
                qtyInput.value = val - 1;
            }
        }
    </script>
