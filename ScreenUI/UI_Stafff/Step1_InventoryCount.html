<!DOCTYPE html>

    <style>
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }

    <style>
        body {
            min-height: max(884px, 100dvh);
        }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
    <!-- TopAppBar -->
    <header
        class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim bg-surface-container-low dark:bg-surface-container-lowest">
        <div class="flex items-center justify-between px-margin-mobile h-16 w-full">
            <button
                class="text-on-surface-variant hover:bg-surface-variant transition-colors active:scale-95 transition-transform p-2 rounded-full flex items-center justify-center">
                <span class="material-symbols-outlined" data-icon="menu">menu</span>
            </button>
            <h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Warehouse
                Pro</h1>
            <button
                class="text-on-surface-variant hover:bg-surface-variant transition-colors active:scale-95 transition-transform p-2 rounded-full flex items-center justify-center">
                <span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
            </button>
        </div>
    </header>
    <!-- Main Content Canvas -->
    <main class="flex-grow mt-16 mb-24 px-margin-mobile md:px-margin-desktop py-lg max-w-7xl mx-auto w-full">
        <!-- Progress Header -->
        <div class="mb-xl text-center w-full">
            <h2 class="font-headline-md text-headline-md text-primary mb-sm">Bước 1/5: Chọn Vị trí</h2>
            <p class="font-body-md text-body-md text-on-surface-variant">Chọn khu vực và dãy kệ cụ thể để bắt đầu kiểm
                kê</p>
            <div class="w-full bg-surface-container-high h-2 rounded-full mt-md overflow-hidden max-w-2xl mx-auto">
                <div class="bg-primary h-full w-1/5 rounded-full transition-all duration-300"></div>
            </div>
        </div>
        <!-- Layout Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-lg lg:gap-gutter">
            <!-- Zones Selection -->
            <section class="lg:col-span-4 flex flex-col gap-md">
                <h3 class="font-title-lg text-title-lg text-on-surface mb-xs">Khu vực Kho</h3>
                <!-- Zone Card: Selected -->
                <button
                    class="w-full text-left bg-surface-container-low border-2 border-primary rounded-xl p-md flex items-center justify-between transition-all active:scale-[0.98]">
                    <div class="flex items-center gap-md">
                        <div
                            class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
                            <span class="font-title-lg text-title-lg font-bold">A</span>
                        </div>
                        <div>
                            <div class="font-label-lg text-label-lg text-on-surface">Khu A - Điện tử</div>
                            <div class="font-label-md text-label-md text-on-surface-variant mt-xs">12 Dãy kệ • 450 Thùng
                            </div>
                        </div>
                    </div>
                    <span class="material-symbols-outlined text-primary" data-icon="check_circle" data-weight="fill"
                        style="font-variation-settings: 'FILL' 1;">check_circle</span>
                </button>
                <!-- Zone Card: Default -->
                <button
                    class="w-full text-left bg-surface rounded-xl p-md border border-surface-variant flex items-center justify-between hover:bg-surface-container transition-colors active:scale-[0.98]">
                    <div class="flex items-center gap-md">
                        <div
                            class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center">
                            <span class="font-title-lg text-title-lg font-bold">B</span>
                        </div>
                        <div>
                            <div class="font-label-lg text-label-lg text-on-surface">Khu B - Quần áo</div>
                            <div class="font-label-md text-label-md text-on-surface-variant mt-xs">8 Dãy kệ • 320 Thùng
                            </div>
                        </div>
                    </div>
                    <span class="material-symbols-outlined text-on-surface-variant opacity-0"
                        data-icon="chevron_right">chevron_right</span>
                </button>
                <!-- Zone Card: Default -->
                <button
                    class="w-full text-left bg-surface rounded-xl p-md border border-surface-variant flex items-center justify-between hover:bg-surface-container transition-colors active:scale-[0.98]">
                    <div class="flex items-center gap-md">
                        <div
                            class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center">
                            <span class="font-title-lg text-title-lg font-bold">C</span>
                        </div>
                        <div>
                            <div class="font-label-lg text-label-lg text-on-surface">Khu C - Hàng dễ hỏng</div>
                            <div class="font-label-md text-label-md text-on-surface-variant mt-xs">5 Dãy kệ • 150 Thùng
                            </div>
                        </div>
                    </div>
                    <span class="material-symbols-outlined text-on-surface-variant opacity-0"
                        data-icon="chevron_right">chevron_right</span>
                </button>
            </section>
            <!-- Aisles Selection (Bento Grid Style) -->
            <section class="lg:col-span-8 flex flex-col gap-md">
                <div class="flex items-center justify-between mb-xs">
                    <h3 class="font-title-lg text-title-lg text-on-surface">Các Dãy kệ trong Khu A</h3>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm"
                            data-icon="search">search</span>
                        <input
                            class="pl-10 pr-4 py-2 bg-surface-container border-none rounded-full font-body-md text-body-md focus:ring-2 focus:ring-primary outline-none w-full md:w-auto"
                            placeholder="Tìm kiếm dãy kệ..." type="text">
                    </div>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-md">
                    <!-- Aisle Bento Card -->
                    <button
                        class="bg-surface rounded-xl p-md border border-surface-variant hover:border-primary hover:shadow-md transition-all text-left flex flex-col gap-sm">
                        <div class="flex justify-between items-start w-full">
                            <span class="font-headline-md text-headline-md text-on-surface">A-01</span>
                            <span class="material-symbols-outlined text-on-surface-variant"
                                data-icon="shelves">shelves</span>
                        </div>
                        <div>
                            <div class="font-label-md text-label-md text-on-surface-variant">Trạng thái</div>
                            <div class="font-label-lg text-label-lg text-secondary">Chờ kiểm tra</div>
                        </div>
                    </button>
                    <!-- Aisle Bento Card -->
                    <button
                        class="bg-surface rounded-xl p-md border border-surface-variant hover:border-primary hover:shadow-md transition-all text-left flex flex-col gap-sm">
                        <div class="flex justify-between items-start w-full">
                            <span class="font-headline-md text-headline-md text-on-surface">A-02</span>
                            <span class="material-symbols-outlined text-on-surface-variant"
                                data-icon="shelves">shelves</span>
                        </div>
                        <div>
                            <div class="font-label-md text-label-md text-on-surface-variant">Trạng thái</div>
                            <div class="font-label-lg text-label-lg text-secondary">Chờ kiểm tra</div>
                        </div>
                    </button>
                    <!-- Aisle Bento Card: In Progress -->
                    <button
                        class="bg-surface-container-low border border-outline-variant rounded-xl p-md hover:border-primary transition-all text-left flex flex-col gap-sm relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-2 h-full bg-tertiary"></div>
                        <div class="flex justify-between items-start w-full pr-sm">
                            <span class="font-headline-md text-headline-md text-on-surface">A-03</span>
                            <span class="material-symbols-outlined text-tertiary" data-icon="pending">pending</span>
                        </div>
                        <div>
                            <div class="font-label-md text-label-md text-on-surface-variant">Trạng thái</div>
                            <div class="font-label-lg text-label-lg text-tertiary">Đang thực hiện</div>
                        </div>
                    </button>
                    <!-- Aisle Bento Card -->
                    <button
                        class="bg-surface rounded-xl p-md border border-surface-variant hover:border-primary hover:shadow-md transition-all text-left flex flex-col gap-sm">
                        <div class="flex justify-between items-start w-full">
                            <span class="font-headline-md text-headline-md text-on-surface">A-04</span>
                            <span class="material-symbols-outlined text-on-surface-variant"
                                data-icon="shelves">shelves</span>
                        </div>
                        <div>
                            <div class="font-label-md text-label-md text-on-surface-variant">Trạng thái</div>
                            <div class="font-label-lg text-label-lg text-secondary">Chờ kiểm tra</div>
                        </div>
                    </button>
                    <!-- Aisle Bento Card -->
                    <button
                        class="bg-surface rounded-xl p-md border border-surface-variant hover:border-primary hover:shadow-md transition-all text-left flex flex-col gap-sm">
                        <div class="flex justify-between items-start w-full">
                            <span class="font-headline-md text-headline-md text-on-surface">A-05</span>
                            <span class="material-symbols-outlined text-on-surface-variant"
                                data-icon="shelves">shelves</span>
                        </div>
                        <div>
                            <div class="font-label-md text-label-md text-on-surface-variant">Trạng thái</div>
                            <div class="font-label-lg text-label-lg text-secondary">Chờ kiểm tra</div>
                        </div>
                    </button>
                </div>
                <!-- Action Area -->
                <div class="mt-lg flex justify-end">
                    <button
                        class="bg-primary text-on-primary font-label-lg text-label-lg py-3 px-6 rounded-full hover:bg-surface-tint transition-colors flex items-center gap-sm active:scale-95 shadow-[0_0_16px_rgba(239,83,80,0.08)]">
                        Tiếp tục Kiểm đếm
                        <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
                    </button>
                </div>
            </section>
        </div>
    </main>
    <!-- BottomNavBar -->
    <nav
        class="md:hidden fixed bottom-0 left-0 w-full z-50 bg-surface dark:bg-surface-dim bg-surface-container-high dark:bg-surface-container-highest flex justify-around items-center h-20 px-2 pb-safe">
        <a class="active:scale-90 transition-transform hover:bg-secondary-container/50 flex flex-col items-center justify-center text-on-secondary-container px-3 py-1 rounded-lg"
            href="#"><span class="material-symbols-outlined">home</span><span
                class="font-label-md text-label-md mt-1">Trang chủ</span></a><a
            class="active:scale-90 transition-transform hover:bg-secondary-container/50 flex flex-col items-center justify-center text-on-secondary-container px-3 py-1 rounded-lg"
            href="#"><span class="material-symbols-outlined">conveyor_belt</span><span
                class="font-label-md text-label-md mt-1">Nhặt đồ</span></a><a
            class="active:scale-90 transition-transform flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-lg px-3 py-1"
            href="#"><span class="material-symbols-outlined filled">inventory_2</span><span
                class="font-label-md text-label-md font-bold mt-1">Kiểm kê</span></a><a
            class="active:scale-90 transition-transform hover:bg-secondary-container/50 flex flex-col items-center justify-center text-on-secondary-container px-3 py-1 rounded-lg"
            href="#"><span class="material-symbols-outlined">settings</span><span
                class="font-label-md text-label-md mt-1">Thiết lập</span></a>
    </nav>
    <!-- Desktop SideNav (Hidden on Mobile, visible on Web if intent matches top-level - though this is a flow, we'll keep it hidden based on rules, but to match the "Bottom Nav" request, we implement it as requested. Actually, per rules, responsive pivot requires full nav cluster on top for web. We'll add desktop nav links to TopAppBar for md:flex) -->
    <div
        class="hidden md:flex fixed top-0 w-full z-40 bg-surface border-b border-surface-variant mt-16 px-margin-desktop h-12 items-center justify-center gap-xl shadow-sm">
        <button
            class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors font-label-lg text-label-lg">
            <span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
            Bảng điều khiển
        </button>
        <button
            class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors font-label-lg text-label-lg">
            <span class="material-symbols-outlined" data-icon="conveyor_belt">conveyor_belt</span>
            Lấy hàng
        </button>
        <button
            class="flex items-center gap-2 text-primary font-bold border-b-2 border-primary h-full font-label-lg text-label-lg">
            <span class="material-symbols-outlined" data-icon="inventory_2" data-weight="fill"
                style="font-variation-settings: 'FILL' 1;">inventory_2</span>
            Kiểm kê
        </button>
        <button
            class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors font-label-lg text-label-lg">
            <span class="material-symbols-outlined" data-icon="settings">settings</span>
            Cài đặt
        </button>
    </div>
</body>

</html>
