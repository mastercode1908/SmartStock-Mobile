    <style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .step-progress-bar {
            height: 4px;
            background: #e2e2e2;
            border-radius: 2px;
            overflow: hidden;
        }

        .step-progress-fill {
            height: 100%;
            background: #b02528;
            width: 60%;
            /* Step 3/5 = 60% */
            transition: width 0.3s ease-out;
        }

        .card-ambient {
            box-shadow: 0 0 32px 0 rgba(239, 83, 80, 0.08);
            border: 1px solid #FEEBEE;
        }

        .input-bottom-border {
            border-bottom: 2px solid #e2bebb;
            background-color: #FEEBEE;
            transition: border-color 0.2s ease;
        }

        .input-bottom-border:focus-within {
            border-bottom-color: #b02528;
            outline: none;
        }

<body class="bg-background text-on-background min-h-screen flex flex-col">
    <!-- TopAppBar -->
    <header class="fixed top-0 w-full h-16 bg-surface flex items-center justify-between px-margin-mobile z-50">
        <div class="flex items-center justify-between px-margin-mobile h-16 w-full">
            <div class="flex items-center gap-md"><button
                    class="active:scale-95 transition-transform text-primary hover:bg-surface-variant p-sm rounded-full flex items-center justify-center"><span
                        class="material-symbols-outlined">close</span></button>
                <h1 class="font-title-lg text-title-lg text-primary font-bold">Warehouse Pro</h1>
            </div><button
                class="active:scale-95 transition-transform text-primary hover:bg-surface-variant p-sm rounded-full flex items-center justify-center"><span
                    class="material-symbols-outlined">help_outline</span></button>
        </div>
    </header>
    <!-- Main Content Canvas -->
    <main class="flex-1 mt-16 mb-20 px-margin-mobile py-lg max-w-lg mx-auto w-full pb-32">
        <!-- Screen Title & Progress -->
        <div class="text-center w-full mb-lg">
            <h2 class="font-headline-md text-headline-md text-primary mb-sm">Bước 3/5: Nhập số lượng</h2>
            <p class="font-body-md text-body-md text-on-surface-variant">Kiểm đếm và nhập số lượng thực tế tại vị trí
            </p>
            <div class="w-full bg-surface-container-high h-2 rounded-full mt-md overflow-hidden">
                <div class="bg-primary h-full w-3/5 rounded-full transition-all duration-300"></div>
            </div>
        </div>
        <!-- Product Details Card -->
        <div
            class="w-full bg-surface-container-lowest border border-outline-variant rounded-[1rem] p-lg mb-xl shadow-[0_4px_16px_rgba(239,83,80,0.08)]">
            <div class="flex items-start gap-md mb-md">
                <div class="w-16 h-16 rounded-[1rem] bg-surface-container overflow-hidden shrink-0"><img
                        alt="Product Image" class="w-full h-full object-cover"
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuAQTn5BVhleKT0tnr2bZE1coZ1m0lJy4aScatSYS8Cgl3uicQYGohAPzY4g_Am86Y6n9Lo5MHi8di7bcnuqXkGv2x8nJgGzgmeMV6wcfdhadGDfZyrUMXwJvlFyIMjITJHrgLkZAcbkrd5kAvrtYQvpN1hMsRqq7FXbKYZ2cx5uZCDyb43PDNzGZFvWL4uDGH8XQfQPDYbU6KwE44mR4MbGiRBJ7RQhpJt4T2BuHEifoia6Q3FPhHbxRK-RZrogFyAeL-zk26Ll6mAk">
                </div>
                <div class="flex-grow">
                    <h3 class="font-title-lg text-title-lg text-on-surface mb-xs">Máy Khoan Pin Cầm Tay Pro-X1</h3>
                    <p class="font-body-md text-body-md text-on-surface-variant">Mã SP: SK-99203-BX</p>
                    <p class="font-body-md text-body-md text-on-surface-variant">Vị trí: Khu vực A, Kệ 04</p>
                </div>
            </div>
            <div class="flex justify-between items-center p-md bg-surface-container rounded-[1rem]"><span
                    class="font-body-lg text-body-lg text-on-surface-variant">Số lượng hệ thống:</span><span
                    class="font-headline-md text-headline-md text-on-surface">10 <span
                        class="font-body-md text-body-md text-on-surface-variant">Cái</span></span></div>
        </div>
        <!-- Picking Control -->
        <div class="w-full flex flex-col items-center mb-xl"><label
                class="font-title-lg text-title-lg text-on-surface mb-md" for="actual-qty">Số lượng thực tế</label>
            <div class="flex items-center justify-center gap-md w-full"><button
                    class="w-16 h-16 rounded-[1rem] bg-surface-container-highest text-on-surface flex items-center justify-center active:scale-95 transition-transform hover:bg-surface-variant shadow-[0_4px_16px_rgba(239,83,80,0.08)]"
                    onclick="decrement()" type="button"><span
                        class="material-symbols-outlined">remove</span></button><input
                    class="w-32 h-20 text-center font-display text-display text-on-surface bg-transparent border-b-2 border-outline focus:border-primary focus:outline-none focus:ring-0 transition-colors bg-[#FEEBEE]/10 rounded-t-[1rem]"

        </div>

                    Quét lại
                </button>
            </div>
            <button
                class="w-full max-w-2xl bg-primary text-on-primary font-title-lg text-title-lg py-md rounded-[1rem] active:scale-95 transition-transform shadow-[0_4px_16px_rgba(239,83,80,0.16)] flex justify-center items-center gap-sm">
                Tiếp theo
                <span class="material-symbols-outlined">arrow_forward</span>
            </button>
        </div>
    </main>
    <!-- BottomNavBar -->

    <script>
        const input = document.getElementById('qty-input');
        const display = document.getElementById('current-qty');
        const statusChip = document.getElementById('status-chip');
        const maxQty = 10;

        function updateUI(val) {
            input.value = val;
            display.innerText = val;

            if (val >= maxQty) {
                statusChip.classList.remove('opacity-0');
                display.classList.add('text-primary');
            } else {
                statusChip.classList.add('opacity-0');
                display.classList.remove('text-primary');
            }
        }

        function increment() {
            let val = parseInt(input.value);
            if (val < maxQty) {
                val++;
                updateUI(val);
                // Simple vibrate effect if supported
                if (window.navigator.vibrate) window.navigator.vibrate(10);
            }
        }

        function decrement() {
            let val = parseInt(input.value);
            if (val > 0) {
                val--;
                updateUI(val);
                if (window.navigator.vibrate) window.navigator.vibrate(5);
            }
        }
    </script>
