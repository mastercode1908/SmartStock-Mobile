<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Smart Stock - Quét mã Vị trí</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#ffb3ae",
                        "secondary-container": "#d7e4ec",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#f1f1f1",
                        "primary-fixed": "#ffdad7",
                        "primary": "#b02528",
                        "on-primary-fixed-variant": "#910816",
                        "error": "#ba1a1a",
                        "on-surface": "#1a1c1c",
                        "primary-container": "#d23e3e",
                        "surface-bright": "#f9f9f9",
                        "surface-container-low": "#f3f3f3",
                        "surface": "#f9f9f9",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#111d23",
                        "secondary": "#546067",
                        "surface-container": "#eeeeee",
                        "tertiary": "#93405f",
                        "inverse-primary": "#ffb3ae",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#b15878",
                        "surface-container-high": "#e8e8e8",
                        "outline-variant": "#e2bebb",
                        "secondary-fixed": "#d7e4ec",
                        "on-tertiary-fixed": "#3e001e",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#ffb0c9",
                        "on-secondary": "#ffffff",
                        "outline": "#8e706e",
                        "surface-dim": "#dadada",
                        "surface-tint": "#b3272a",
                        "on-secondary-fixed-variant": "#3c494f",
                        "tertiary-fixed": "#ffd9e2",
                        "on-primary-fixed": "#410004",
                        "inverse-surface": "#2f3131",
                        "on-secondary-container": "#5a666d",
                        "surface-variant": "#e2e2e2",
                        "on-tertiary-fixed-variant": "#792b4a",
                        "on-primary-container": "#fffbff",
                        "surface-container-highest": "#e2e2e2",
                        "on-background": "#1a1c1c",
                        "on-surface-variant": "#5a413f",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#bbc8d0",
                        "background": "#f9f9f9",
                        "on-tertiary-container": "#fffbff"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "xl": "32px",
                        "margin-desktop": "40px",
                        "2xl": "48px",
                        "lg": "24px",
                        "3xl": "64px",
                        "xs": "4px",
                        "base": "4px",
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "label-md": ["Hanken Grotesk"],
                        "label-lg": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "display": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "title-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display": ["56px", { "lineHeight": "64px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "500" }]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }

        .scanner-overlay {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
        }

        .scanner-frame {
            box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.6);
        }

        .scan-line {
            height: 2px;
            background: linear-gradient(to right, transparent, #EF5350, transparent);
            animation: scan 2s ease-in-out infinite;
        }

        @keyframes scan {
            0% {
                top: 0%;
            }

            50% {
                top: 100%;
            }

            100% {
                top: 0%;
            }
        }
    </style>
</head>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
    <!-- TopAppBar -->
    <header class="fixed top-0 w-full bg-surface z-50 h-16 flex items-center justify-between px-margin-mobile">
        <div class="flex items-center gap-md">
            <button class="p-2 transition-colors duration-200 hover:bg-surface-container rounded-full text-primary">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h1 class="font-headline-md text-headline-md text-primary font-bold">Bước 2/5: Quét mã Vị trí</h1>
        </div>
        <div class="flex items-center gap-sm">
            <button
                class="p-2 transition-colors duration-200 hover:bg-surface-container rounded-full text-on-surface-variant">
                <span class="material-symbols-outlined">help</span>
            </button>
        </div>
    </header>
    <!-- Main Content (Canvas) -->
    <main class="flex-grow pt-16 pb-20 relative overflow-hidden flex flex-col">
        <!-- Target Location Card -->
        <div class="px-margin-mobile py-md z-20">
            <div
                class="bg-surface-container-lowest border border-outline-variant p-md rounded-lg flex items-center justify-between shadow-sm">
                <div class="flex flex-col">
                    <span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Vị trí
                        cần đến</span>
                    <span class="font-display text-headline-lg text-primary font-bold">A-12-04</span>
                </div>
                <div class="bg-primary-container p-sm rounded-full">
                    <span class="material-symbols-outlined text-on-primary-container"
                        style="font-variation-settings: 'FILL' 1;">warehouse</span>
                </div>
            </div>
        </div>
        <!-- Camera Scanner Mockup -->
        <div class="flex-grow relative bg-black flex items-center justify-center overflow-hidden">
            <!-- Simulated Camera Background -->
            <div class="absolute inset-0 w-full h-full"
                data-alt="A POV perspective of a high-tech warehouse aisle with industrial shelving and neatly stacked cardboard boxes. The scene is viewed through a professional barcode scanning interface. Soft ambient light from high ceilings illuminates the organized environment, dominated by soft whites and grays with a clinical, modern fintech aesthetic.">
                <img class="w-full h-full object-cover opacity-80"
                    data-alt="A POV perspective of a high-tech warehouse aisle with industrial shelving and neatly stacked cardboard boxes. The scene is viewed through a professional barcode scanning interface. Soft ambient light from high ceilings illuminates the organized environment, dominated by soft whites and grays with a clinical, modern fintech aesthetic."
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuCTqL5EcExNMBEN3q3OYv_pW-wP3Cx5hCUoo8exohltYS28kZNkNcfOxBKpKoDqY8JPge5nljrLzRYiIPDiohfY4Lowumir6ql897Sawa5Xc4FZbuNE8zMyyWBc2zBpInVq5KDWV_Jj2vmu1y23iGLMZEcCyRMBbRCio-oQKeLqC17vSYUh7uF5cYHJE3BoOmI-ylG390XldcFG_tRykiXwnht5rF4D51wdCy7LAeUozWYu_7w7ZdRNApfAlup4wrvxflJd0ubJQjqF">
            </div>
            <!-- Scanner Frame and UI Overlay -->
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                <div
                    class="relative w-64 h-64 md:w-80 md:h-80 scanner-frame border-2 border-primary rounded-lg overflow-hidden">
                    <!-- Corner Accents -->
                    <div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-sm"></div>
                    <div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-sm">
                    </div>
                    <div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-sm">
                    </div>
                    <div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-sm">
                    </div>
                    <!-- Animated Scan Line -->
                    <div class="absolute w-full scan-line z-10"></div>
                </div>
                <p class="mt-xl px-xl text-center text-white font-label-lg drop-shadow-md">
                    Căn chỉnh mã QR/Barcode của vị trí vào giữa khung để quét
                </p>
            </div>
            <!-- Manual Entry Trigger -->
            <div class="absolute bottom-xl left-0 w-full px-margin-mobile flex justify-center">
                <button
                    class="bg-surface-container-highest/90 backdrop-blur-md text-on-surface py-md px-2xl rounded-full border border-outline-variant flex items-center gap-sm transition-transform active:scale-95">
                    <span class="material-symbols-outlined">keyboard</span>
                    <span class="font-label-lg">Nhập thủ công</span>
                </button>
            </div>
            <!-- Flashlight Toggle -->
            <button
                class="absolute top-md right-md bg-black/40 p-md rounded-full text-white backdrop-blur-sm border border-white/20 active:bg-black/60">
                <span class="material-symbols-outlined">flashlight_on</span>
            </button>
        </div>
        <!-- Inventory Info Tip (Bottom Floating) -->
        <div class="px-margin-mobile pb-sm z-20">
            <div class="bg-white/90 backdrop-blur-sm border border-primary/20 p-md rounded-lg flex gap-md items-start">
                <span class="material-symbols-outlined text-primary">info</span>
                <p class="font-body-md text-on-surface-variant">
                    Sản phẩm: <span class="font-bold text-on-surface">Màn hình Dell UltraSharp 27"</span><br>
                    Số lượng yêu cầu: <span class="text-primary font-bold">12</span>
                </p>
            </div>
        </div>
    </main>
    <!-- BottomNavBar -->
    <nav
        class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 px-2 pb-safe bg-surface border-t border-outline-variant z-50">
        <!-- Dashboard (Inactive) -->
        <button
            class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 scale-95 active:scale-90 transition-transform duration-150">
            <span class="material-symbols-outlined">dashboard</span>
            <span class="font-label-md text-label-md">Dashboard</span>
        </button>
        <!-- Picking (Active) -->
        <button
            class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 scale-95 active:scale-90 transition-transform duration-150">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
            <span class="font-label-md text-label-md">Picking</span>
        </button>
        <!-- Inventory (Inactive) -->
        <button
            class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 scale-95 active:scale-90 transition-transform duration-150">
            <span class="material-symbols-outlined">warehouse</span>
            <span class="font-label-md text-label-md">Inventory</span>
        </button>
        <!-- Settings (Inactive) -->
        <button
            class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 scale-95 active:scale-90 transition-transform duration-150">
            <span class="material-symbols-outlined">settings</span>
            <span class="font-label-md text-label-md">Settings</span>
        </button>
    </nav>
    <script>
        // Micro-interaction for manual entry button
        const manualBtn = document.querySelector('button:has(span:contains("Nhập thủ công"))');
        if (manualBtn) {
            manualBtn.addEventListener('click', () => {
                alert('Chức năng nhập mã thủ công đang được khởi tạo.');
            });
        }

        // Simple flashlight toggle simulation
        const flashlightBtn = document.querySelector('button:has(span:contains("flashlight_on"))');
        let isFlashOn = false;
        if (flashlightBtn) {
            flashlightBtn.addEventListener('click', () => {
                isFlashOn = !isFlashOn;
                flashlightBtn.querySelector('span').innerText = isFlashOn ? 'flashlight_off' : 'flashlight_on';
                flashlightBtn.classList.toggle('bg-primary', isFlashOn);
                flashlightBtn.classList.toggle('text-white', isFlashOn);
            });
        }
    </script>
</body>

</html>
