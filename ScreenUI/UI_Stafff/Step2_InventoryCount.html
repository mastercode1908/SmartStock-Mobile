<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">try {
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        "colors": {
                            "background": "#f9f9f9",
                            "primary": "#b02528",
                            "on-tertiary-container": "#fffbff",
                            "surface-variant": "#e2e2e2",
                            "on-tertiary-fixed-variant": "#792b4a",
                            "on-surface-variant": "#5a413f",
                            "on-primary": "#ffffff",
                            "surface-bright": "#f9f9f9",
                            "primary-fixed-dim": "#ffb3ae",
                            "primary-fixed": "#ffdad7",
                            "tertiary": "#93405f",
                            "surface-container-high": "#e8e8e8",
                            "surface-container": "#eeeeee",
                            "primary-container": "#d23e3e",
                            "inverse-primary": "#ffb3ae",
                            "surface-container-low": "#f3f3f3",
                            "error-container": "#ffdad6",
                            "on-error": "#ffffff",
                            "surface-container-highest": "#e2e2e2",
                            "surface-container-lowest": "#ffffff",
                            "secondary-container": "#d7e4ec",
                            "surface": "#f9f9f9",
                            "outline-variant": "#e2bebb",
                            "on-primary-fixed-variant": "#910816",
                            "tertiary-container": "#b15878",
                            "secondary": "#546067",
                            "outline": "#8e706e",
                            "tertiary-fixed-dim": "#ffb0c9",
                            "on-secondary-fixed-variant": "#3c494f",
                            "inverse-surface": "#2f3131",
                            "error": "#ba1a1a",
                            "secondary-fixed-dim": "#bbc8d0",
                            "on-primary-fixed": "#410004",
                            "on-background": "#1a1c1c",
                            "on-secondary": "#ffffff",
                            "secondary-fixed": "#d7e4ec",
                            "on-tertiary-fixed": "#3e001e",
                            "on-secondary-fixed": "#111d23",
                            "surface-dim": "#dadada",
                            "on-tertiary": "#ffffff",
                            "on-surface": "#1a1c1c",
                            "on-error-container": "#93000a",
                            "tertiary-fixed": "#ffd9e2",
                            "on-secondary-container": "#5a666d",
                            "inverse-on-surface": "#f1f1f1",
                            "surface-tint": "#b3272a",
                            "on-primary-container": "#fffbff"
                        },
                        "borderRadius": {
                            "DEFAULT": "1rem",
                            "lg": "2rem",
                            "xl": "3rem",
                            "full": "9999px"
                        },
                        "spacing": {
                            "md": "16px",
                            "xs": "4px",
                            "margin-mobile": "16px",
                            "3xl": "64px",
                            "2xl": "48px",
                            "margin-desktop": "40px",
                            "sm": "8px",
                            "lg": "24px",
                            "base": "4px",
                            "gutter": "24px",
                            "xl": "32px"
                        },
                        "fontFamily": {
                            "display": ["Hanken Grotesk"],
                            "body-md": ["Hanken Grotesk"],
                            "body-lg": ["Hanken Grotesk"],
                            "headline-md": ["Hanken Grotesk"],
                            "label-lg": ["Hanken Grotesk"],
                            "headline-lg": ["Hanken Grotesk"],
                            "title-lg": ["Hanken Grotesk"],
                            "headline-lg-mobile": ["Hanken Grotesk"],
                            "label-md": ["Hanken Grotesk"]
                        },
                        "fontSize": {
                            "display": ["56px", { "lineHeight": "64px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                            "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                            "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                            "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                            "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600" }],
                            "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                            "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "500" }],
                            "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                            "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]
                        }
                    }
                }
            }
        } catch (_e) { }</script>
</head>

<body class="bg-background text-on-background w-full h-screen flex flex-col overflow-hidden antialiased">
    <!-- Header Section -->
    <header
        class="w-full flex flex-col items-center justify-center pt-8 pb-4 px-margin-mobile z-50 bg-surface absolute top-0 left-0">
        <div class="flex items-center justify-between w-full absolute top-4 px-margin-mobile">
            <button aria-label="Back"
                class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/20 transition-colors text-primary">
                <span class="material-symbols-outlined text-title-lg">close</span>
            </button>
            <button aria-label="Help"
                class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/20 transition-colors text-primary">
                <span class="material-symbols-outlined text-title-lg"
                    data-original-icon="help_outline">help_outline</span>
            </button>
        </div>
        <div class="flex flex-col items-center mt-6">
            <h1 class="font-headline-md text-headline-md font-bold text-primary mb-sm">Bước 2/5: Quét mã sản phẩm</h1>
            <p class="font-body-md text-body-md text-on-surface-variant text-center">Căn chỉnh mã vạch vào trong khung
                đỏ</p>
        </div>
    </header>
    <!-- Camera Viewfinder -->
    <main class="flex-grow relative flex items-center justify-center w-full h-full bg-inverse-surface pt-32">
        <!-- Background Camera Feed Placeholder -->
        <div class="absolute inset-0 w-full h-full bg-cover bg-center"
            data-alt="A POV view through a mobile device camera looking at a cardboard warehouse box with a prominent white barcode label. The background shows blurred warehouse shelving in a modern logistics center. The lighting is bright and industrial, matching a light-mode high-end UI aesthetic with deep blacks, pristine whites, and subtle red accents."
            style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDAyk0c8uRuF72bB7fS2xeDbNse09i_8fqg8KD_5iOrx11zgoo02chVYmm4cP9KeXyA0HYMGEwnrXGPhGDcQtgQxu3EHnqrKREPVVHbzp0z66xPaZsag20ClodSis4-ZLYRfTtVOGU3IckSH0UXJbBEvOyGRJBH7TDf40mskCgUMBqRRUDc1BwnIbGCPE01KWiYZhFD7l0ujOw_B_Q1MbHjDtI4m0Rot484x4egVLCGJzSpFEV2kkHnK_2OTlx_9aOrsjUdOrypuF12')">
        </div>
        <!-- Location Indicator Overlay -->
        <div class="absolute top-4 w-full px-margin-mobile z-40 flex justify-center">
            <div
                class="bg-surface-container-highest/90 backdrop-blur-md rounded-full px-4 py-2 flex items-center gap-sm shadow-md border border-surface-variant">
                <span class="material-symbols-outlined text-primary text-label-lg"
                    style="font-variation-settings: 'FILL' 1;">location_on</span>
                <span class="font-label-lg text-label-lg text-on-surface">Khu vực B - Kệ 04 - Tầng 2</span>
            </div>
        </div>
        <!-- Scanner Overlay -->
        <div class="relative w-72 h-48 border-2 border-primary rounded-lg overflow-hidden scanner-frame z-30">
            <!-- Corner Accents -->
            <div class="absolute top-0 left-0 w-6 h-6 border-t-4 border-l-4 border-primary rounded-tl-lg"></div>
            <div class="absolute top-0 right-0 w-6 h-6 border-t-4 border-r-4 border-primary rounded-tr-lg"></div>
            <div class="absolute bottom-0 left-0 w-6 h-6 border-b-4 border-l-4 border-primary rounded-bl-lg"></div>
            <div class="absolute bottom-0 right-0 w-6 h-6 border-b-4 border-r-4 border-primary rounded-br-lg"></div>
            <!-- Laser Line -->
            <div class="absolute w-full h-0.5 bg-primary laser-line shadow-[0_0_8px_2px_rgba(239,83,80,0.8)]"></div>
        </div>
    </main>
    <!-- Bottom Actions -->
    <footer
        class="absolute bottom-0 w-full px-margin-mobile pb-safe pt-lg bg-gradient-to-t from-inverse-surface via-inverse-surface/80 to-transparent z-50 flex flex-col items-center gap-md h-40">
        <!-- Flashlight Toggle -->
        <button
            class="w-12 h-12 rounded-full bg-surface-container/20 backdrop-blur-sm border border-outline/30 flex items-center justify-center text-on-primary hover:bg-surface-container/40 transition-colors mb-2">
            <span class="material-symbols-outlined text-title-lg">flashlight_on</span>
        </button>
        <!-- Manual Entry Button -->
        <button
            class="w-full h-14 bg-primary text-on-primary font-label-lg text-label-lg rounded-[1rem] flex items-center justify-center gap-sm active:scale-95 transition-transform shadow-[0_4px_16px_rgba(239,83,80,0.16)]">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">keyboard</span>
            Nhập thủ công
        </button>
    </footer>
</body>

</html>
