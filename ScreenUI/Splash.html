    <style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
        }

        .progress-bar-container {
            width: 200px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            overflow: hidden;
            margin-top: 24px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #b02528; /* Red primary as per guidelines */
            border-radius: 9999px;
            animation: load 2.5s ease-in-out infinite;
        }

        @keyframes load {
            0% { width: 0%; transform: translateX(-100%); }
            50% { width: 40%; transform: translateX(50%); }
            100% { width: 100%; transform: translateX(100%); }
        }

        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        .fade-in-up-delay {
            animation: fadeInUp 0.8s ease-out 0.3s forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <style>
        body {
          min-height: max(884px, 100dvh);

<span class="material-symbols-outlined text-[64px] text-on-primary-container" data-icon="inventory_2" style="font-variation-settings: 'FILL' 1;">
