<!DOCTYPE html><html lang="vi"><head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Tạo phiếu kiểm kê - Smart Stock</title>
    <!-- Google Fonts & Material Icons -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Tailwind Config -->
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-dim": "#d1dce0",
                      "tertiary-fixed": "#5af9f3",
                      "surface-container-highest": "#d9e4e9",
                      "inverse-on-surface": "#e7f3f7",
                      "surface-tint": "#b3272e",
                      "primary": "#b3272e",
                      "secondary-container": "#dae1e3",
                      "tertiary": "#006a67",
                      "on-error-container": "#93000a",
                      "secondary-fixed-dim": "#c1c8ca",
                      "surface-container-low": "#eaf5fa",
                      "on-tertiary-fixed-variant": "#00504e",
                      "on-primary-container": "#64000d",
                      "background": "#f1fbff",
                      "on-background": "#131d21",
                      "inverse-primary": "#ffb3af",
                      "on-tertiary": "#ffffff",
                      "on-primary": "#ffffff",
                      "surface-variant": "#d9e4e9",
                      "inverse-surface": "#283236",
                      "on-primary-fixed-variant": "#91081a",
                      "surface-container-lowest": "#ffffff",
                      "on-error": "#ffffff",
                      "error-container": "#ffdad6",
                      "surface-container-high": "#dfeaef",
                      "tertiary-fixed-dim": "#2edcd7",
                      "on-secondary-fixed": "#161d1f",
                      "outline": "#8d706e",
                      "on-secondary-container": "#5d6466",
                      "on-tertiary-fixed": "#00201f",
                      "surface-container": "#e4f0f4",
                      "secondary": "#586062",
                      "error": "#ba1a1a",
                      "surface-bright": "#f1fbff",
                      "secondary-fixed": "#dde4e6",
                      "on-primary-fixed": "#410005",
                      "on-secondary-fixed-variant": "#41484a",
                      "primary-container": "#ff5f5f",
                      "on-secondary": "#ffffff",
                      "on-tertiary-container": "#003533",
                      "primary-fixed": "#ffdad7",
                      "outline-variant": "#e1bebc",
                      "tertiary-container": "#00a7a3",
                      "on-surface-variant": "#59413f",
                      "on-surface": "#131d21",
                      "surface": "#f1fbff",
                      "primary-fixed-dim": "#ffb3af"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xl": "48px",
                      "gutter": "24px",
                      "xs": "4px",
                      "unit": "4px",
                      "margin-mobile": "16px",
                      "md": "16px",
                      "lg": "24px",
                      "sm": "8px",
                      "margin-desktop": "64px"
              },
              "fontFamily": {
                      "headline-lg": ["Hanken Grotesk"],
                      "headline-lg-mobile": ["Hanken Grotesk"],
                      "label-md": ["JetBrains Mono"],
                      "title-md": ["Hanken Grotesk"],
                      "body-lg": ["Hanken Grotesk"],
                      "display-lg": ["Hanken Grotesk"],
                      "body-sm": ["Hanken Grotesk"]
              },
              "fontSize": {
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
    <style>
        body { background-color: #f1fbff; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 24px rgba(0,0,0,0.03);
        }
    </style>
</head>
<body class="bg-white text-on-surface font-body-lg min-h-screen flex flex-col antialiased">
<!-- TopAppBar (Transactional - Hidden Nav Links on Desktop, Back Button) -->
<header class="bg-white w-full top-0 border-b border-surface-container-highest flex items-center justify-between px-margin-mobile h-16 w-full sticky z-50"><div class="flex items-center gap-sm"><button class="p-2 rounded-full hover:bg-surface-variant/50 text-on-surface-variant transition-colors"><span class="material-symbols-outlined">arrow_back</span></button><h1 class="font-title-md text-title-md text-on-surface text-primary">Tạo phiếu kiểm kê</h1></div><div class="flex items-center"><span class="material-symbols-outlined text-primary" style="font-variation-settings: &quot;FILL&quot; 1;">inventory_2</span></div></header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center p-margin-mobile md:p-margin-desktop pb-32">
    <div class="w-full max-w-2xl">
        <p class="font-body-sm text-body-sm text-on-surface-variant mb-lg">Điền thông tin chi tiết để bắt đầu quá trình kiểm kê kho mới.</p>
        <form class="glass-panel rounded-xl p-md md:p-lg flex flex-col gap-lg">
            <!-- Warehouse Name -->
            <div class="flex flex-col gap-xs">
                <label class="font-label-md text-label-md text-on-surface-variant uppercase" for="warehouse">Tên kho</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/60" data-icon="warehouse">warehouse</span>
                    <select class="w-full bg-white border border-surface-variant rounded-lg pl-10 pr-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all appearance-none" id="warehouse">
                        <option disabled="" selected="" value="">Chọn kho cần kiểm kê...</option>
                        <option value="main">Kho Chính</option>
                        <option value="parts_a">Kho Linh Kiện A</option>
                        <option value="export_b">Kho Xuất B</option>
                    </select>
                    <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/60 pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
                </div>
            </div>
            <!-- Location -->
            <div class="flex flex-col gap-xs">
                <label class="font-label-md text-label-md text-on-surface-variant uppercase" for="location">Vị trí</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/60" data-icon="location_on">location_on</span>
                    <input class="w-full bg-white border border-surface-variant rounded-lg pl-10 pr-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all" id="location" placeholder="VD: Kệ A-12, Khu vực 1" type="text">
                </div>
            </div>
            <!-- Inventory Date -->
            <div class="flex flex-col gap-xs">
                <label class="font-label-md text-label-md text-on-surface-variant uppercase" for="date">Ngày kiểm kê</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/60" data-icon="calendar_today">calendar_today</span>
                    <input class="w-full bg-white border border-surface-variant rounded-lg pl-10 pr-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all" id="date" type="date" value="2023-10-27">
                </div>
            </div>
            <!-- Person in Charge -->
            <div class="flex flex-col gap-xs">
                <label class="font-label-md text-label-md text-on-surface-variant uppercase" for="pic">Người thực hiện</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/60" data-icon="person">person</span>
                    <input class="w-full bg-surface-container-low border border-surface-variant rounded-lg pl-10 pr-4 py-3 font-body-lg text-body-lg text-on-surface-variant focus:outline-none cursor-not-allowed" id="pic" readonly="" type="text" value="Nguyễn Văn A">
                </div>
            </div>
            <!-- Description/Notes -->
            <div class="flex flex-col gap-xs">
                <label class="font-label-md text-label-md text-on-surface-variant uppercase" for="notes">Ghi chú</label>
                <textarea class="w-full bg-white border border-surface-variant rounded-lg p-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all resize-none" id="notes" placeholder="Nhập ghi chú hoặc lý do kiểm kê..." rows="3"></textarea>
            </div>
        </form>
        <!-- Bottom Action Area -->
        <div class="mt-lg w-full flex justify-end">
            <button class="w-full md:w-auto bg-primary text-on-primary rounded-full px-lg py-3 font-title-md text-title-md shadow-md hover:bg-opacity-90 transition-colors active:scale-95 flex items-center justify-center gap-sm"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>Bắt đầu kiểm kê</button>
        </div>
    </div>
</main>
<!-- Navigation Suppressed: Transactional/Task-Focused Screen -->


</body></html>
