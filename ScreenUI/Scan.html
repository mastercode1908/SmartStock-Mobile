<!DOCTYPE html><html lang="vi"><head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Quét mã QR/Barcode - Smart Stock</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-tint": "#b3272e",
                      "on-tertiary-fixed": "#00201f",
                      "tertiary-fixed": "#5af9f3",
                      "secondary-fixed": "#dde4e6",
                      "outline": "#8d706e",
                      "secondary-container": "#dae1e3",
                      "secondary": "#586062",
                      "surface-container-lowest": "#ffffff",
                      "inverse-on-surface": "#e7f3f7",
                      "surface-container": "#e4f0f4",
                      "primary-container": "#ff5f5f",
                      "on-secondary-fixed": "#161d1f",
                      "on-secondary-container": "#5d6466",
                      "background": "#f1fbff",
                      "tertiary": "#006a67",
                      "error-container": "#ffdad6",
                      "error": "#ba1a1a",
                      "primary": "#b3272e",
                      "on-tertiary": "#ffffff",
                      "surface-container-high": "#dfeaef",
                      "on-primary-fixed-variant": "#91081a",
                      "on-surface-variant": "#59413f",
                      "surface": "#f1fbff",
                      "on-surface": "#131d21",
                      "on-tertiary-container": "#003533",
                      "tertiary-fixed-dim": "#2edcd7",
                      "on-secondary": "#ffffff",
                      "surface-bright": "#f1fbff",
                      "on-primary-container": "#64000d",
                      "surface-dim": "#d1dce0",
                      "surface-container-highest": "#d9e4e9",
                      "on-tertiary-fixed-variant": "#00504e",
                      "inverse-primary": "#ffb3af",
                      "tertiary-container": "#00a7a3",
                      "on-primary": "#ffffff",
                      "secondary-fixed-dim": "#c1c8ca",
                      "on-secondary-fixed-variant": "#41484a",
                      "outline-variant": "#e1bebc",
                      "primary-fixed-dim": "#ffb3af",
                      "surface-container-low": "#eaf5fa",
                      "on-background": "#131d21",
                      "surface-variant": "#d9e4e9",
                      "on-error-container": "#93000a",
                      "on-error": "#ffffff",
                      "inverse-surface": "#283236",
                      "primary-fixed": "#ffdad7",
                      "on-primary-fixed": "#410005"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xl": "48px",
                      "sm": "8px",
                      "margin-desktop": "64px",
                      "unit": "4px",
                      "gutter": "24px",
                      "xs": "4px",
                      "margin-mobile": "16px",
                      "md": "16px",
                      "lg": "24px"
              },
              "fontFamily": {
                      "headline-lg": ["Hanken Grotesk"],
                      "headline-lg-mobile": ["Hanken Grotesk"],
                      "display-lg": ["Hanken Grotesk"],
                      "body-sm": ["Hanken Grotesk"],
                      "body-lg": ["Hanken Grotesk"],
                      "title-md": ["Hanken Grotesk"],
                      "label-md": ["JetBrains Mono"]
              },
              "fontSize": {
                      "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                      "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                      "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                      "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                      "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                      "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                      "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }]
              }
            }
          }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        /* Scanning Laser Animation */
        @keyframes scan-laser {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 98%; opacity: 0; }
        }

        .animate-scan {
            animation: scan-laser 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* Safe area padding for mobile notches */
        .pt-safe { padding-top: env(safe-area-inset-top, 1rem); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
    </style>
</head>
<body class="bg-black text-on-surface h-[884px] w-full overflow-hidden relative font-body-lg antialiased">
<!-- Camera Feed Background Simulation -->
<div class="absolute inset-0 z-0">
    <img alt="Warehouse aisle" class="w-full h-full object-cover scale-105" data-alt="A first-person view looking down a bright, modern warehouse aisle lined with tall, white metal shelving units holding neatly stacked cardboard boxes. The lighting is crisp and even, creating an airy and organized atmosphere typical of an efficient logistics center. The image is slightly out of focus, simulating a mobile device's camera feed waiting to lock onto a barcode." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDO_kelXFvrzA16Mdv4C8XHoh7g9TtG7mtfV21YltGe6RpVMB2DSoBQYB2ydv_WQ4u5wIfSbDGi97LU7gJfAPZDG5qm2sW9_y4jK-cBHSH6IswzXllNqiciycrKwM-TY1Kihsfiia_WmQspWgPBN2W5_EIg23FYuvWHFckthhRJCjyApQ5o7zOWaMcDh_IkYtROuvHBMkifn1xY4T2NUhFYv-fvrIs6A4EqZD21Y9xnG4COmscd71yvD3rsaGoN_R4ehoWR3qovIFRt">
</div>
<!-- Dark Overlay with Central Cutout Mask -->
<svg class="absolute inset-0 w-full h-full z-10 pointer-events-none">
    <defs>
        <mask id="scanner-cutout">
            <!-- Everything is white (visible overlay) -->
            <rect fill="white" height="100%" width="100%"></rect>
            <!-- The center box is black (transparent cutout) -->
            <!-- x,y positioned roughly center, slightly offset up for better ergonomics on mobile -->
            <rect fill="black" height="280" rx="24" transform="translate(-140, -140)" width="280" x="50%" y="40%"></rect>
        </mask>
    </defs>
    <!-- The semi-transparent dark layer applied via the mask -->
    <rect fill="rgba(0, 0, 0, 0.65)" height="100%" mask="url(#scanner-cutout)" width="100%"></rect>
</svg>
<!-- Task Header (Suppresses standard TopAppBar) -->
<header class="absolute top-0 left-0 w-full z-20 flex justify-between items-center px-margin-mobile pt-safe h-20 bg-gradient-to-b from-black/60 to-transparent pointer-events-auto">
    <button aria-label="Đóng" class="w-12 h-12 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 active:scale-95 transition-all backdrop-blur-md border border-white/10">
        <span class="material-symbols-outlined text-white" style="font-variation-settings: 'wght' 300;">close</span>
    </button>
    <h1 class="font-title-md text-title-md text-white drop-shadow-md tracking-wide">Quét mã</h1>
    <div class="w-12 h-12"></div> <!-- Spacer for balancing layout -->
</header>
<!-- Scanner Frame Highlights & Laser (Z-20, overlays the hole) -->
<div class="absolute top-[40%] left-[50%] -translate-x-1/2 -translate-y-1/2 w-[280px] h-[280px] z-20 pointer-events-none">
    <!-- Corner Markers (Using vibrant coral/primary-container to match brand 'đỏ nhạt sáng') -->
    <div class="absolute top-0 left-0 w-12 h-12 border-t-[3px] border-l-[3px] border-primary-container rounded-tl-3xl"></div>
    <div class="absolute top-0 right-0 w-12 h-12 border-t-[3px] border-r-[3px] border-primary-container rounded-tr-3xl"></div>
    <div class="absolute bottom-0 left-0 w-12 h-12 border-b-[3px] border-l-[3px] border-primary-container rounded-bl-3xl"></div>
    <div class="absolute bottom-0 right-0 w-12 h-12 border-b-[3px] border-r-[3px] border-primary-container rounded-br-3xl"></div>
    <!-- Animated Laser Line -->
    <div class="absolute left-4 right-4 h-[2px] bg-primary-container rounded-full shadow-[0_0_12px_rgba(255,95,95,1)] animate-scan"></div>
</div>
<!-- Instruction Text -->
<div class="absolute top-[calc(40%+160px)] left-0 w-full px-8 text-center z-20 pointer-events-none">
    <div class="inline-block px-4 py-2 rounded-full bg-black/40 backdrop-blur-md border border-white/10">
        <p class="font-body-sm text-body-sm text-white drop-shadow-sm tracking-wide">Căn chỉnh mã vào khung để quét</p>
    </div>
</div>
<!-- Bottom Controls Area -->
<div class="absolute bottom-0 left-0 w-full z-20 px-margin-mobile pb-safe pt-12 flex flex-col items-center gap-8 bg-gradient-to-t from-black/90 via-black/50 to-transparent pointer-events-auto">
    <!-- Action Buttons Row -->
    <div class="flex gap-10">
        <!-- Flash Toggle -->
        <button class="flex flex-col items-center gap-3 group" onclick="this.classList.toggle('text-primary-container'); this.querySelector('.bg-circle').classList.toggle('bg-white/20');">
            <div class="bg-circle w-14 h-14 rounded-full bg-white/10 backdrop-blur-xl flex items-center justify-center border border-white/20 group-active:scale-90 transition-all duration-200 shadow-lg">
                <span class="material-symbols-outlined text-white group-[.text-primary-container]:text-primary-container transition-colors" style="font-variation-settings: 'FILL' 1;">flashlight_on</span>
            </div>
            <span class="font-label-md text-label-md text-white/90 uppercase tracking-widest group-[.text-primary-container]:text-primary-container transition-colors">Flash</span>
        </button>
        <!-- Gallery/Upload (Common scanner utility) -->
        <button class="flex flex-col items-center gap-3 group">
            <div class="w-14 h-14 rounded-full bg-white/10 backdrop-blur-xl flex items-center justify-center border border-white/20 group-active:scale-90 transition-all duration-200 shadow-lg">
                <span class="material-symbols-outlined text-white">photo_library</span>
            </div>
            <span class="font-label-md text-label-md text-white/90 uppercase tracking-widest">Thư viện</span>
        </button>
    </div>
    <!-- Manual Entry Primary Button -->
    <!-- Using 'surface' color from theme to create a bright, clean, floating button that contrasts with dark camera -->
    <button class="w-full max-w-[340px] mb-6 h-14 rounded-xl bg-surface text-on-surface font-title-md text-title-md flex items-center justify-center gap-3 shadow-[0_8px_32px_rgba(0,0,0,0.3)] active:scale-[0.98] transition-transform duration-200 border border-white/40">
        <span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'wght' 300;">keyboard</span>
        Nhập mã thủ công
    </button>
</div>
</body></html>
